id: skewer
group: Tactics
title: Skewer
steps:
- type: explain
  text: A skewer attacks a valuable piece that must move, exposing a less valuable piece behind it. It
    is a pin in reverse.
- type: move
  fen: 6q1/8/4k3/8/8/8/8/4KB2 w - - 0 1
  prompt: White to move. Check the king so that you win the queen behind it.
  accept:
  - f1c4
  why: 'Bc4+ forces the king aside and Bxg8 wins the queen: a skewer.'
  hint: The bishop check lines up the king and the queen.
- type: move
  fen: 4q3/8/8/4k3/8/8/8/R5K1 w - - 0 1
  prompt: White to move. Check the king so that you win the queen behind it.
  accept:
  - a1e1
  why: 'Re1+ forces the king off the file and Rxe8 wins the queen: a skewer.'
  hint: Check along the e-file.
- type: move
  fen: 4kb2/8/8/8/8/4K3/8/6Q1 b - - 0 1
  prompt: Black to move. Check the king so that you win the queen behind it.
  accept:
  - f8c5
  why: 'Bc4+ forces the king aside and Bxg8 wins the queen: a skewer.'
  hint: The bishop check lines up the king and the queen.
- type: move
  fen: r5k1/8/8/8/4K3/8/8/4Q3 b - - 0 1
  prompt: Black to move. Check the king so that you win the queen behind it.
  accept:
  - a8e8
  why: 'Re1+ forces the king off the file and Rxe8 wins the queen: a skewer.'
  hint: Check along the e-file.
- type: move
  fen: 4q3/8/8/4k3/8/8/6K1/7R w - - 0 1
  prompt: White to move. Check the king so that you win the queen behind it.
  accept:
  - h1e1
  why: Re1+ skewers the king and the queen.
  hint: Check along the e-file.
