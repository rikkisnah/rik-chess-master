id: discovered-attack
group: Tactics
title: Discovered attack
steps:
- type: explain
  text: A discovered attack happens when you move one piece and uncover an attack by another piece behind
    it. If the uncovered attack is a check, the moving piece gets a free move!
- type: move
  fen: 4k3/8/8/8/6q1/8/4B3/4RK2 w - - 0 1
  prompt: White to move. Win the queen with a discovered check.
  accept:
  - e2g4
  why: Bxg4+ captures the queen while the rook gives check from behind.
  hint: Move the bishop with a capture.
- type: move
  fen: 4k3/8/8/5q2/8/4N3/8/4RK2 w - - 0 1
  prompt: White to move. Win the queen with a discovered check.
  accept:
  - e3f5
  why: Nxf5+ captures the queen while the rook gives check.
  hint: Move the knight with a capture.
- type: move
  fen: 4rk2/4b3/8/6Q1/8/8/8/4K3 b - - 0 1
  prompt: Black to move. Win the queen with a discovered check.
  accept:
  - e7g5
  why: Bxg4+ captures the queen while the rook gives check from behind.
  hint: Move the bishop with a capture.
