id: back-rank-mate
group: Tactics
title: Back-rank mate
steps:
- type: explain
  text: A king stuck on its back rank behind its own pawns can be checkmated by a rook or queen. Always
    leave your king a flight square - a pawn move (luft) does it.
- type: move
  fen: 6k1/5ppp/8/8/8/8/8/R3K3 w - - 0 1
  prompt: White to move. Checkmate in one.
  accept:
  - a1a8
  why: The king is trapped behind its own pawns.
  hint: Check on the back rank.
- type: move
  fen: 3r2k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1
  prompt: White to move. Checkmate in one.
  accept:
  - d1d8
  why: 'Rxd8#: the back rank falls.'
  hint: Trade rooks with check.
- type: move
  fen: 1k6/ppp5/8/8/8/8/7Q/1K6 w - - 0 1
  prompt: White to move. Checkmate in one.
  accept:
  - h2h8
  why: 'Qa8#: the back rank again.'
  hint: Check on the back rank.
- type: move
  fen: 3r2k1/5ppp/8/8/8/8/5PPP/3R2K1 b - - 0 1
  prompt: Black to move. Checkmate in one.
  accept:
  - d8d1
  why: 'Rxd8#: the back rank falls.'
  hint: Trade rooks with check.
- type: move
  fen: 6k1/5ppp/8/8/8/8/Q7/6K1 w - - 0 1
  prompt: White to move. Checkmate in one.
  accept:
  - a2a8
  why: 'Qa8#: the back rank again.'
  hint: Check on the back rank.
