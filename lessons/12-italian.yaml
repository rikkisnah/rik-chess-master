id: italian
group: Openings
title: Italian Game
steps:
- type: explain
  text: 'The Italian Game: 1.e4 e5 2.Nf3 Nc6 3.Bc4. White develops quickly and eyes the weak f7 square.
    Play the main line from memory.'
- type: line
  color: white
  moves:
  - e4
  - e5
  - Nf3
  - Nc6
  - Bc4
  - Bc5
  - c3
  - Nf6
  - d4
  - exd4
  whys:
  - Claim the centre and open lines for the bishop and queen.
  - Develop with a threat on e5.
  - The bishop eyes f7, Black's weakest point.
  - Prepare d4 to grab the centre.
  - Strike in the centre!
