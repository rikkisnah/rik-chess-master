id: pin
group: Tactics
title: Pin
steps:
- type: explain
  text: A pin is an attack on a piece that cannot move without exposing a more valuable piece (often the
    king) behind it.
- type: move
  fen: 4k3/3n4/8/8/8/8/4B3/4K3 w - - 0 1
  prompt: White to move. Pin the knight to the king.
  accept:
  - e2b5
  why: 'Bb5 pins the knight: it cannot move without exposing its king.'
  hint: Attack along the diagonal.
- type: move
  fen: 4k3/4n3/8/8/8/8/8/R5K1 w - - 0 1
  prompt: White to move. Pin the knight to the king.
  accept:
  - a1e1
  why: Re1 pins the knight on the e-file.
  hint: Use the e-file.
- type: move
  fen: 8/4k3/5n2/8/8/8/8/2B1K3 w - - 0 1
  prompt: White to move. Pin the knight to the king.
  accept:
  - c1g5
  why: Bg5 pins the knight to the king on e7.
  hint: The bishop can reach g5.
- type: move
  fen: 4k3/4b3/8/8/8/8/3N4/4K3 b - - 0 1
  prompt: Black to move. Pin the knight to the king.
  accept:
  - e7b4
  why: 'Bb5 pins the knight: it cannot move without exposing its king.'
  hint: Attack along the diagonal.
- type: move
  fen: 8/3k4/2n5/8/8/8/8/3K1B2 w - - 0 1
  prompt: White to move. Pin the knight to the king.
  accept:
  - f1b5
  why: Bg5 pins the knight to the king on e7.
  hint: The bishop can reach g5.
