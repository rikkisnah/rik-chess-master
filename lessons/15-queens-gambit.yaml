id: queens-gambit
group: Openings
title: Queen's Gambit
steps:
- type: explain
  text: 'The Queen''s Gambit: 1.d4 d5 2.c4. White offers a pawn to deflect Black''s centre pawn. Play
    the main line.'
- type: line
  color: white
  moves:
  - d4
  - d5
  - c4
  - e6
  - Nc3
  - Nf6
  - Bg5
  - Be7
  - e3
  - O-O
  - Nf3
  whys:
  - Take space in the centre.
  - Attack d5 - if Black takes, White regains the pawn easily.
  - Add pressure to d5 and develop.
  - Pin the knight that guards d5.
  - Support the centre and open the bishop's retreat.
  - Develop the last minor piece and prepare to castle.
