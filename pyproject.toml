[project]
name = "rik-chess-master"
version = "0.1.0"
description = "Desktop chess app: tutorial, famous games, two player, play vs machine"
requires-python = ">=3.12"
dependencies = ["python-chess>=1.11", "pyyaml>=6", "websockets>=13"]

[project.scripts]
rcm = "rcm.ui.app:main"
rcm-relay = "rcm.net.relay:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (deep perft)", "ui: needs a display"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
